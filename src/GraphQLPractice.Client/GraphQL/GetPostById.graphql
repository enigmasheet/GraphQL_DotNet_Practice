query GetPostById($id: Int!) {
  postById(id: $id) {
    id
    title
    slug
    body
    status
    createdAt
    publishedAt
    author {
      id
      name
    }
    tags(first: 20) {
      nodes {
        id
        name
      }
    }
    comments(first: 50) {
      totalCount
      nodes {
        id
        text
        createdAt
        author {
          id
          name
        }
      }
    }
  }
}
