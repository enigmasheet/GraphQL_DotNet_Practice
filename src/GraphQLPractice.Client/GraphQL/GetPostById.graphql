query GetPostById($id: ID!) {
  node(id: $id) {
    __typename
    ... on BlogPost {
      id
      title
      slug
      body
      status
      createdAt
      publishedAt
      author {
        id
        name
      }
      tags(first: 20) {
        nodes {
          id
          name
        }
      }
      comments(first: 50) {
        totalCount
        nodes {
          id
          text
          createdAt
          author {
            id
            name
          }
        }
      }
    }
  }
}
