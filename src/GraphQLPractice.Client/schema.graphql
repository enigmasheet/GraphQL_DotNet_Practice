schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  authors(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: AuthorFilterInput
    order: [AuthorSortInput!]
  ): AuthorsConnection
  posts(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BlogPostFilterInput
    order: [BlogPostSortInput!]
  ): PostsConnection
  authorById(id: Int!): Author
  postById(id: Int!): BlogPost
  tags: [Tag!]!
}

type Mutation {
  createAuthor(input: CreateAuthorInput!): CreateAuthorPayload!
  createPost(input: CreatePostInput!): CreatePostPayload!
  updatePost(input: UpdatePostInput!): UpdatePostPayload!
  deletePost(input: DeletePostInput!): DeletePostPayload!
  addComment(input: AddCommentInput!): AddCommentPayload!
}

type Subscription {
  onPostPublished: BlogPost!
  onCommentAdded(postId: Int!): Comment!
}

type Author {
  posts: [BlogPost!]!
  id: Int!
  name: String!
  bio: String
  createdAt: DateTime!
}

type BlogPost {
  author: Author!
  comments: [Comment!]!
  tags: [Tag!]!
  id: Int!
  title: String!
  slug: String!
  body: String!
  status: PostStatus!
  createdAt: DateTime!
  publishedAt: DateTime
  authorId: Int!
}

type Comment {
  author: Author!
  post: BlogPost!
  id: Int!
  text: String!
  createdAt: DateTime!
  blogPostId: Int!
  authorId: Int!
}

input AuthorFilterInput {
  and: [AuthorFilterInput!]
  or: [AuthorFilterInput!]
  id: IntOperationFilterInput
  name: StringOperationFilterInput
  bio: StringOperationFilterInput
  createdAt: DateTimeOperationFilterInput
}

input AuthorSortInput {
  id: SortEnumType
  name: SortEnumType
  bio: SortEnumType
  createdAt: SortEnumType
}

input BlogPostFilterInput {
  and: [BlogPostFilterInput!]
  or: [BlogPostFilterInput!]
  id: IntOperationFilterInput
  title: StringOperationFilterInput
  slug: StringOperationFilterInput
  body: StringOperationFilterInput
  status: PostStatusOperationFilterInput
  createdAt: DateTimeOperationFilterInput
  publishedAt: DateTimeOperationFilterInput
  authorId: IntOperationFilterInput
}

input BlogPostSortInput {
  id: SortEnumType
  title: SortEnumType
  slug: SortEnumType
  body: SortEnumType
  status: SortEnumType
  createdAt: SortEnumType
  publishedAt: SortEnumType
  authorId: SortEnumType
}

"A connection to a list of items."
type AuthorsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [AuthorsEdge!]
  "A flattened list of the nodes."
  nodes: [Author!]
  "Identifies the total count of items in the connection."
  totalCount: Int!
}

"A connection to a list of items."
type PostsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [PostsEdge!]
  "A flattened list of the nodes."
  nodes: [BlogPost!]
  "Identifies the total count of items in the connection."
  totalCount: Int!
}

type AuthorNotFoundError implements Error {
  message: String!
  authorId: Int!
}

type SlugAlreadyInUseError implements Error {
  message: String!
  slug: String!
}

type PostNotFoundError implements Error {
  message: String!
  postId: Int!
}

input IntOperationFilterInput {
  eq: Int
  neq: Int
  in: [Int]
  nin: [Int]
  gt: Int
  ngt: Int
  gte: Int
  ngte: Int
  lt: Int
  nlt: Int
  lte: Int
  nlte: Int
}

input StringOperationFilterInput {
  and: [StringOperationFilterInput!]
  or: [StringOperationFilterInput!]
  eq: String
  neq: String
  contains: String
  ncontains: String
  in: [String]
  nin: [String]
  startsWith: String
  nstartsWith: String
  endsWith: String
  nendsWith: String
}

input DateTimeOperationFilterInput {
  eq: DateTime
  neq: DateTime
  in: [DateTime]
  nin: [DateTime]
  gt: DateTime
  ngt: DateTime
  gte: DateTime
  ngte: DateTime
  lt: DateTime
  nlt: DateTime
  lte: DateTime
  nlte: DateTime
}

enum SortEnumType {
  ASC
  DESC
}

input PostStatusOperationFilterInput {
  eq: PostStatus
  neq: PostStatus
  in: [PostStatus!]
  nin: [PostStatus!]
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

"An edge in a connection."
type AuthorsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Author!
}

"An edge in a connection."
type PostsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: BlogPost!
}

interface Error {
  message: String!
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime

type Tag {
  id: Int!
  name: String!
  posts: [BlogPost!]!
}

enum PostStatus {
  DRAFT
  PUBLISHED
}

input CreateAuthorInput {
  name: String!
  bio: String
}

type CreateAuthorPayload {
  author: Author
}

input CreatePostInput {
  title: String!
  body: String!
  authorId: Int!
  status: PostStatus!
  tagIds: [Int!]
}

union CreatePostError = AuthorNotFoundError | SlugAlreadyInUseError

type CreatePostPayload {
  blogPost: BlogPost
  errors: [CreatePostError!]
}

input UpdatePostInput {
  id: Int!
  title: String
  body: String
  status: PostStatus
}

union UpdatePostError = PostNotFoundError | SlugAlreadyInUseError

type UpdatePostPayload {
  blogPost: BlogPost
  errors: [UpdatePostError!]
}

input DeletePostInput {
  id: Int!
}

union DeletePostError = PostNotFoundError

type DeletePostPayload {
  blogPost: BlogPost
  errors: [DeletePostError!]
}

input AddCommentInput {
  postId: Int!
  authorId: Int!
  text: String!
}

union AddCommentError = AuthorNotFoundError | PostNotFoundError

type AddCommentPayload {
  comment: Comment
  errors: [AddCommentError!]
}

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

"The purpose of the `@listSize` directive is to either inform the static analysis about the size of returned lists (if that information is statically available), or to point the analysis to where to find that information."
directive @listSize(
  "The `assumedSize` argument can be used to statically define the maximum length of a list returned by a field."
  assumedSize: Int
  "The `slicingArguments` argument can be used to define which of the field's arguments with numeric type are slicing arguments, so that their value determines the size of the list returned by that field. It may specify a list of multiple slicing arguments."
  slicingArguments: [String!]
  "The `slicingArgumentDefaultValue` argument can be used to define a default value for a slicing argument, which is used if the argument is not present in a query."
  slicingArgumentDefaultValue: Int
  "The `sizedFields` argument can be used to define that the value of the `assumedSize` argument or of a slicing argument does not affect the size of a list returned by a field itself, but that of a list returned by one of its sub-fields."
  sizedFields: [String!]
  "The `requireOneSlicingArgument` argument can be used to inform the static analysis that it should expect that exactly one of the defined slicing arguments is present in a query. If that is not the case (i.e., if none or multiple slicing arguments are present), the static analysis may throw an error."
  requireOneSlicingArgument: Boolean = true
) on FIELD_DEFINITION
